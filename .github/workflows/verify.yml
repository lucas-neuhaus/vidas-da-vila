name: Verify full-stack application

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vidas
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: vidas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidas -d vidas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vidas:ci-only@127.0.0.1:5432/vidas_test
      ADMIN_API_TOKEN: test-token-for-ephemeral-ci-database-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: pip install -r backend/requirements-dev.txt
      - run: npm run check && npm test && npm run build
      - name: Check backend and migrate PostgreSQL
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
          python -m pytest -q
      - run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: |
          (cd backend && exec python -m uvicorn app.main:app --port 8000) > /tmp/vidas-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"; cat /tmp/vidas-api.log' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/health
          npm run test:e2e

  compose:
    name: Validar a execução com Docker Compose
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: vidas_compose_test
      POSTGRES_PASSWORD: ci-only@compose:password
      POSTGRES_HOST_PORT: "25432"
      WEB_HOST_PORT: "18080"
      ADMIN_API_TOKEN: test-token-for-ephemeral-compose-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Conferir site, catálogo e proteção do histórico
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/ | grep -F 'Instituto Vidas'
          curl --fail http://127.0.0.1:18080/api/health | jq -e '.status == "ok"'
          curl --fail http://127.0.0.1:18080/api/projects | jq -e 'length == 3'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/admin/volunteers)" = 401
          curl --fail --header "Authorization: Bearer $ADMIN_API_TOKEN" http://127.0.0.1:18080/api/admin/volunteers | jq -e '. == []'
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
